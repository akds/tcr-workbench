[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esmc-mlx"
version = "0.1.0"
description = "Strict, numerically validated ESM-C inference for Apple Silicon"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["mlx==0.32.2", "numpy>=1.26,<3", "pydantic>=2.7,<3", "safetensors>=0.6,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
convert = ["torch>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["esmc_mlx*"]

[tool.setuptools.package-data]
esmc_mlx = ["licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires explicitly supplied real checkpoint artifacts"]
